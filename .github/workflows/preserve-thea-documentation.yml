name: Preserve Thea documentation

on:
  page_build:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preserve-thea-documentation
  cancel-in-progress: false

jobs:
  restore:
    name: Verify documentation subtree
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Check documentation
        id: documentation
        shell: bash
        run: |
          if [[ -f thea/documentation/index.html ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Thea
        if: steps.documentation.outputs.present != 'true'
        uses: actions/checkout@v5
        with:
          repository: EIT-HAI/Thea
          ref: main
          path: _thea_source

      - name: Set up Python
        if: steps.documentation.outputs.present != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: _thea_source/docs/requirements.txt

      - name: Build documentation
        if: steps.documentation.outputs.present != 'true'
        run: |
          python -m pip install -r _thea_source/docs/requirements.txt
          make -C _thea_source/docs clean html

      - name: Restore documentation subtree
        if: steps.documentation.outputs.present != 'true'
        shell: bash
        run: |
          mkdir -p thea/documentation
          rsync -a --delete \
            _thea_source/docs/_build/html/ \
            thea/documentation/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- thea/documentation
          git commit -m "fix: restore Thea documentation"
          git push origin HEAD:gh-pages
